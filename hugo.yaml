    - identifier: "universe"
      name: "↩ Volver a PowerTrader"
      url: "https://powertrader.es"
      weight: 1
    - identifier: "inicio"
      name: "Inicio"
      url: "/"
      weight: 10
    - identifier: "articulos"
      name: "Artículos"
      url: "/posts/"
      weight: 20
    - identifier: "sobre"
      name: "Sobre"
      url: "/about/"
      weight: 30
    - identifier: "buscar"
      name: "🔍"
      url: "/search/"
      weight: 40

sitemap:
  changefreq: "daily"
  priority: 0.8
  filename: "sitemap.xml"
