baseURL: "https://energyflash.powertrader.es/"
languageCode: "es-es"
title: "PowerTrader EnergyFlash"
theme: "PaperMod"

params:
  label:
    text: " "
    icon: /logo.svg
    iconHeight: 80
  env: "production"
  title: "PowerTrader EnergyFlash"
  description: "Inteligencia diaria de mercados y análisis de precios de energía"
  author: "PowerTrader"
  ShowToc: true
  ShowBreadCrumbs: true
  Canonical: true
  disableThemeToggle: true
  defaultTheme: "dark"
  ShowPostNavLinks: true
  subname: "EnergyFlash"
  assets:
    favicon: /favicon.svg
    disableHLJS: true
  socialIcons:
    - name: "linkedin"
      url: "https://linkedin.com/company/power-trader"
    - name: "x"
      url: "https://x.com/PowerSPTrader"

markup:
  goldmark:
    renderer:
      unsafe: true

menu:
