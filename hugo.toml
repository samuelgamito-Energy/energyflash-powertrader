baseURL = "https://energyflash.powertrader.es/"
languageCode = "es-es"
title = "PowerTrader EnergyFlash"
theme = "PaperMod"

[params]
    env = "production"
    title = "PowerTrader EnergyFlash"
    description = "Inteligencia diaria de mercados"
    author = "PowerTrader"
    disableThemeToggle = false
    defaultTheme = "dark"
    ShowPostNavLinks = true
    subname = "EnergyFlash" # Cambia esto por "Ahorro", "Solar", etc.
    description = "Análisis diario de precios de energía"
    homeText = "Bienvenido a EnergyFlash. Aquí encontrarás el análisis diario del pool eléctrico, precios OMIE y tendencias del mercado mayorista."

    [params.assets]
        disableHLJS = true # Excelente para mantener la web ligera
    [params.social]
    linkedin = "https://linkedin.com/in/tu-usuario"
    x = "https://x.com/tu-usuario"

# --- BLOQUE DE SEGURIDAD PARA VER LAS TABLAS HTML ---
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Añadir al final del archivo hugo.toml
[[menu.main]]
    identifier = "universe"
    name = "⮌ Volver a PowerTrader"
    url = "https://powertrader.es"
    weight = 10

[sitemap]
  changefreq = "daily"
  priority = 0.8
  filename = "sitemap.xml"
